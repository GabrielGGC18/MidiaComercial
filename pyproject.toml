[project]
name = "midiacomercial"
version = "0.1.0"
description = "Camada leve de inteligência comercial para pequenos lojistas"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "django-ninja>=1.3",
    "pydantic>=2.7",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "gunicorn>=23",
    "faker>=30",
    "openpyxl>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff==0.17.5",  # fixo: versão nova do ruff muda o formato e quebra o CI sem mudança de código
    "pre-commit>=4",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.format]
# docs/tasks trazem trechos ilustrativos em markdown: o formatador cuida só do código Python
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# B008: File(...)/Form(...) como default é o padrão do Django Ninja (estilo FastAPI)
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# frases de interface (português de loja) ficam inteiras para facilitar revisão de texto
"apps/inteligencia/regras/*" = ["E501"]
"apps/inteligencia/explicacao/*" = ["E501"]
"apps/core/demo.py" = ["E501"]
"apps/agente/**" = ["E501"]
"apps/notificacoes/**" = ["E501"]
# utilitário de geração de áudio da demo (frases e comando do ffmpeg legíveis numa linha)
"frontend/scripts/*" = ["E501"]
