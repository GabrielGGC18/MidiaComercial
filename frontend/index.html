<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="description" content="MidiaComercial: inteligência comercial para lojistas de shopping. Cruza vendas, procuras sem estoque, estoque parado e público, e entrega até 3 decisões por semana com evidência." />
    <title>MidiaComercial</title>
    <script>
      // aplica o tema antes do primeiro paint (sem flash)
      try {
        const t = localStorage.getItem("mc-tema");
        if (t === "escuro" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
