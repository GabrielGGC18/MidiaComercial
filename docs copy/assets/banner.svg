<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">MidiaComercial</title>
  <desc id="d">Inteligência comercial para pequenos lojistas. Seus sinais de venda, em uma só mídia.</desc>
  <defs>
    <radialGradient id="brilho" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#6D4AFF" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#2A1677" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="midia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2DCFF"/>
      <stop offset=".55" stop-color="#A898FF"/>
      <stop offset="1" stop-color="#6D4AFF"/>
    </linearGradient>
    <linearGradient id="comercial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE2EE"/>
    </linearGradient>
    <linearGradient id="linha" x1="0" x2="1">
      <stop offset="0" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#FF6A3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="luz" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- texto do título (reutilizado nas camadas da extrusão) -->
    <g id="titulo" font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="76" letter-spacing="-1">
      <text x="0" y="0">Mídia<tspan dx="14">Comercial</tspan></text>
    </g>
  </defs>

  <!-- fundo -->
  <rect x="1" y="1" width="898" height="298" rx="22" fill="#0B1020" stroke="#2A1677" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="298" rx="22" fill="url(#brilho)"/>

  <!-- overline -->
  <text x="48" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.2" fill="#FF6A3D">INTELIGÊNCIA COMERCIAL · PEQUENO VAREJO · PALMAS-TO</text>

  <!-- ÚNICO efeito 3D: extrusão do nome (camadas deslocadas em diagonal) -->
  <g transform="translate(48 150)">
    <g fill="#140C3D">
      <use href="#titulo" x="9" y="9"/><use href="#titulo" x="8" y="8"/><use href="#titulo" x="7" y="7"/>
      <use href="#titulo" x="6" y="6"/><use href="#titulo" x="5" y="5"/>
    </g>
    <g fill="#2A1677">
      <use href="#titulo" x="4" y="4"/><use href="#titulo" x="3" y="3"/><use href="#titulo" x="2" y="2"/><use href="#titulo" x="1" y="1"/>
    </g>
    <g font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="76" letter-spacing="-1">
      <text x="0" y="0"><tspan fill="url(#midia)">Mídia</tspan><tspan dx="14" fill="url(#comercial)">Comercial</tspan></text>
    </g>
  </g>

  <!-- assinatura -->
  <text x="48" y="204" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#EEF1F7">Seus sinais de venda, em uma só mídia.</text>
  <rect x="48" y="218" width="460" height="3" rx="1.5" fill="url(#linha)"/>
  <text x="48" y="256" font-family="Consolas,'JetBrains Mono',Menlo,monospace" font-size="13" fill="#B9C0D4">django 5.2 · ninja 1.8 · react 19 · vite 8 · tailwind 4 · postgresql 16</text>

  <!-- marca: três barras de sinal (plano); a terceira em coral = o sinal que faltava -->
  <g transform="translate(704 74)" filter="url(#luz)">
    <rect x="0" y="80" width="34" height="70" rx="9" fill="#A898FF"/>
    <rect x="50" y="42" width="34" height="108" rx="9" fill="#6D4AFF"/>
    <rect x="100" y="0" width="34" height="150" rx="9" fill="#FF6A3D"/>
  </g>
  <g fill="none" stroke-linecap="round" transform="translate(682 250)">
    <path d="M0 0c18 0 18-12 36-12s18 12 36 12 18-12 36-12 18 12 36 12 18-12 36-12" stroke="#A898FF" stroke-opacity=".55" stroke-width="2"/>
    <path d="M0 14c18 0 18-8 36-8s18 8 36 8 18-8 36-8 18 8 36 8 18-8 36-8" stroke="#FF6A3D" stroke-width="2" stroke-dasharray="4 6"/>
  </g>
</svg>
