repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key       # bloqueia chave privada no commit
      - id: check-added-large-files  # bloqueia dump/planilha grande por engano
        args: ["--maxkb=500"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks                 # procura senha, token e chave de API
  - repo: local
    hooks:
      - id: proibir-env
        name: proibir arquivos .env, bancos e planilhas
        entry: "Arquivo sensível: não versione .env, banco, dump ou planilha de clientes."
        language: fail
        files: '(^|/)\.env|\.(sqlite3?|db|dump|sql|csv|xlsx)$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
