<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">MidiaComercial</title>
  <desc id="d">Monograma MC e assinatura MIDIA | Comercial. Inteligência comercial para pequenos lojistas.</desc>
  <!-- Identidade: docs/logo-01-monograma-mc.md · roxo #6D4AFF, verde neon #B6FF3B -->
  <defs>
    <radialGradient id="brilho" cx="80%" cy="48%" r="46%">
      <stop offset="0" stop-color="#6D4AFF" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#2A1677" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="midia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A898FF"/>
      <stop offset="1" stop-color="#6D4AFF"/>
    </linearGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E73FF"/>
      <stop offset="1" stop-color="#6D4AFF"/>
    </linearGradient>
    <linearGradient id="linha" x1="0" x2="1">
      <stop offset="0" stop-color="#B6FF3B"/>
      <stop offset="1" stop-color="#B6FF3B" stop-opacity="0"/>
    </linearGradient>
    <filter id="luz" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fundo -->
  <rect x="1" y="1" width="898" height="298" rx="22" fill="#0B1020" stroke="#2A1677" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="298" rx="22" fill="url(#brilho)"/>

  <!-- overline -->
  <text x="48" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.2" fill="#B6FF3B">INTELIGÊNCIA COMERCIAL · PEQUENO VAREJO · PALMAS-TO</text>

  <!-- assinatura: MIDIA | Comercial -->
  <text x="48" y="150" font-family="'Plus Jakarta Sans','Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="-1">
    <tspan font-size="76" fill="url(#midia)">MIDIA</tspan><tspan dx="16" font-size="64" font-weight="300" fill="#FFFFFF" fill-opacity=".35">|</tspan><tspan dx="16" font-size="60" fill="#B6FF3B">Comercial</tspan>
  </text>

  <text x="48" y="204" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#EEF1F7">Sua loja sabe o que vende? E o porquê?</text>
  <rect x="48" y="218" width="460" height="3" rx="1.5" fill="url(#linha)"/>
  <text x="48" y="256" font-family="Consolas,'JetBrains Mono',Menlo,monospace" font-size="13" fill="#B9C0D4">django 5.2 · ninja 1.8 · react 19 · vite 8 · tailwind 4 · postgresql 16</text>

  <!-- marca: monograma MC, com a abertura do C em verde neon -->
  <g transform="translate(676 92) scale(2.6) translate(-4 -18)">
    <path fill="url(#letra)" d="M6 60V20L24 38 42 20V60H31V45L24 52 17 45V60Z"/>
    <path fill="url(#letra)" d="M70 20H54L44 30V50L54 60H70V49H59L55 45V35L59 31H70Z"/>
    <path fill="#B6FF3B" filter="url(#luz)" d="M54 20H70V31H59L54 36Z"/>
  </g>
  <rect x="676" y="226" width="177" height="3" rx="1.5" fill="#B6FF3B" fill-opacity=".85"/>
</svg>
