# VPS (deploy em Docker atrás do nginx do host):
#   sudo docker compose -f docker-compose.vps.yml up -d --build
#
# - Projeto isolado (`name`), rede própria, banco próprio: nada compartilhado com os
#   outros serviços da VPS.
# - API só em 127.0.0.1:8001: quem fala com a internet é o nginx do host (TLS certbot).
# - O web roda com o uid/gid do usuário `midiacomercial` do host (MC_UID/MC_GID no .env)
#   para usar o socket da ponte do Hermes (/var/lib/midiacomercial-hermes).
# - Estáticos do /admin servidos pelo whitenoise dentro do container.
# - Mesmo arquivo para produção e teste: MC_PROJETO e MC_PORTA no .env de cada pasta
#   separam projeto Docker (rede, volume do banco), imagem e porta. Sem eles = produção.
#     produção: /srv/midiacomercial      (main)    → midiacomercial      · 127.0.0.1:8001
#     teste:    /srv/midiacomercial-dev  (develop) → midiacomercial-dev  · 127.0.0.1:8002
name: ${MC_PROJETO:-midiacomercial}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midiacomercial}
      POSTGRES_USER: ${POSTGRES_USER:-midiacomercial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midiacomercial}"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    image: ${MC_PROJETO:-midiacomercial}-web:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    user: "${MC_UID:?defina MC_UID no .env}:${MC_GID:?defina MC_GID no .env}"
    ports:
      - "127.0.0.1:${MC_PORTA:-8001}:8000"
    volumes:
      - /var/lib/midiacomercial-hermes:/var/lib/midiacomercial-hermes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/saude', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 900m
    restart: unless-stopped

  # Avisos "ação atrasada" e "estoque desatualizado" (Observer) de hora em hora.
  # O observer agrupa repetições em 24 h, então rodar várias vezes não gera spam.
  prazos:
    image: ${MC_PROJETO:-midiacomercial}-web:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    # de hora em hora: prazos; uma vez por dia (a cada 24 voltas): retenção LGPD do agente
    entrypoint: ["sh", "-c", "sleep 60; i=0; while true; do python manage.py verificar_prazos; [ $$((i % 24)) -eq 0 ] && python manage.py limpar_agente; i=$$((i + 1)); sleep 3600; done"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:
